<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Офис</title>
<meta name="theme-color" content="#1c252d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Офис">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one office floor seen from above at an angle, framed like an app window; readable lists below it */
:root{
  --page:#e7eaee;
  --frame:#1c252d;
  --paper:#ffffff;
  --ink:#1b2530;
  --muted:#5f6c79;
  --line:#d6dde4;
  --accent:#1f7a6d;
  --ask:#f0a020;
  --ask-soft:#fff4dc;
  --font-head:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.45 var(--font-body);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance}
h2{font-size:1.05rem;font-weight:800}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--ask);outline-offset:2px}

/* Top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--frame);z-index:20}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--frame);color:#fff}
.top-in{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font:800 1.15rem var(--font-head);margin-right:auto}
.logo{width:28px;height:28px;border-radius:8px;background:var(--ask);color:var(--frame);display:grid;place-items:center;font-size:.95rem}
.chip{font-size:.82rem;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:#dfe8ee;border:0;min-height:34px;white-space:nowrap}
.chip b{color:#fff}
button.chip{cursor:pointer}
.chip.hot{background:var(--ask);color:var(--frame)}
.chip.hot b{color:var(--frame)}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.top .btn{min-height:36px;background:#fff;border-color:#fff;color:var(--frame)}
.demo{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:#9fb0bd}

main{display:grid;gap:16px;padding-block:14px 40px}
.card{background:var(--paper);border-radius:14px;border:1px solid var(--line)}

/* Floor */
.floor{background:var(--frame);border-radius:16px;padding:8px;box-shadow:0 10px 30px rgba(20,30,40,.18)}
.floor-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#9fb0bd;font-size:.78rem;padding:2px 6px 8px}
.floor-bar b{color:#e6edf2;font-weight:600}
#scene{display:block;width:100%;height:auto;border-radius:10px;background:#ebe7df;touch-action:manipulation}
#scene text{font-family:var(--font-body)}
.wall{fill:#36414c}.base{fill:#262f38}
.glass{fill:rgba(190,220,238,.20);stroke:#a3c6dc;stroke-width:3}
.door{stroke:#ebe7df;stroke-width:5}
.zl{font-weight:700;font-size:9px;letter-spacing:.14em;fill:#8a8f94}
.zs{font-size:8.5px;fill:#9aa1a8}
.dt{fill:#cfa675}.df{fill:#a97c4f}.de{fill:#8f6740}
.tag-bg{fill:#fbf8f2;stroke:#e1d4bf}
.tag-t{font-weight:600;font-size:8.8px;fill:#1b2530}
.pill-t{font-weight:700;font-size:7.4px;fill:#fff}
.nm{font-weight:600;font-size:8.6px;fill:#4f5b67}
.scr-t{font-weight:600;font-size:8px;fill:#cfe6ff}
.brd-t{font-size:9px;fill:#1b2530}.brd-n{font-weight:700;font-size:9px;fill:#1f7a6d}

.person{cursor:pointer}
.person .hit{fill:transparent}
.person .v-chair,.person .arms-type,.person .arm-up,.person .cup,.person .ring{display:none}
.pose-sitf .body{transform:translateY(12px)}
.pose-sitf .legs,.pose-sitf .arms-down,.pose-sitf .shadow{display:none}
.pose-sitf .arms-type,.pose-sitf .v-chair{display:inline}
.asking .arm-up{display:inline}.asking .arm-r{display:none}
.pose-cup .cup{display:inline}.pose-cup .arm-r{display:none}
.person:hover .ring,.person:focus-visible .ring{display:inline}
.person:focus{outline:none}
.walk .leg-l{animation:stepA .5s ease-in-out infinite alternate}
.walk .leg-r{animation:stepA .5s ease-in-out infinite alternate-reverse}
.walk .upper{animation:bobA .25s ease-in-out infinite alternate}
.busy .arms-type{animation:typeA .4s ease-in-out infinite alternate}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.say-q{animation:bobA .6s ease-in-out infinite alternate}
@keyframes stepA{from{transform:translateY(0)}to{transform:translateY(-2.2px)}}
@keyframes bobA{to{transform:translateY(-1.5px)}}
@keyframes typeA{to{transform:translateY(.8px)}}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.fan{animation:none}

/* Below the floor */
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:grid;gap:16px;min-width:0}
.pad{padding:14px 16px}
.questions{display:grid;gap:12px}
.questions:empty{display:none}
.q{padding:14px;border:2px solid var(--ask);background:var(--ask-soft);border-radius:14px}
.q-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:.84rem;color:var(--muted)}
.q-head b{color:var(--ink);font-family:var(--font-head);font-size:.95rem}
.q-text{margin:8px 0 10px;font:700 1rem/1.35 var(--font-head)}
.q-opts{display:flex;flex-wrap:wrap;gap:8px}
.q-opts .btn{background:#fff;border-color:#e8c98a}
.q-own{display:flex;gap:8px;margin-top:8px}
.q-own input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;background:#fff}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}

.staff{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px}
.staff li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding:8px;border-radius:10px;cursor:pointer;align-items:center}
.staff li:hover{background:#f3f5f7}
.ava{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 .9rem var(--font-head)}
.s-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.s-top b{font-family:var(--font-head)}
.s-top span{font-size:.8rem;color:var(--muted)}
.s-task{font-size:.84rem;color:var(--ink);overflow-wrap:anywhere}
.s-st{font-size:.78rem;color:var(--muted)}
.s-st.wait{color:#9a5b00;font-weight:600}
.bar{height:5px;border-radius:999px;background:#e4e9ee;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .8s ease}

.task-form{display:grid;gap:10px}
.task-form label{font-size:.82rem;color:var(--muted);font-weight:600}
.task-form textarea,.task-form select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
.task-form textarea{resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row>div{display:grid;gap:4px;min-width:0}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.feed ol{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px;max-height:280px;overflow:auto}
.feed li{display:flex;gap:10px;font-size:.88rem}
.feed time{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.feed li.me{font-weight:600}
footer{text-align:center}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;min-height:44px}

.modal{position:fixed;inset:0;z-index:30;background:rgba(20,32,42,.45);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:min(560px,100%);max-height:100%;overflow:auto;padding:18px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.summary{font:600 1rem/1.4 var(--font-head);margin:6px 0 4px}
.rep h3{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.rep ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.rep li{font-size:.92rem}
.rep li .dot{margin-right:6px}
.rep li .btn{min-height:36px;padding:0 12px;margin:4px 0 0 6px}
.rep .none{color:var(--muted)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.92rem;margin:8px 0 12px}
.facts dt{color:var(--muted)}.facts dd{margin:0}

.login{position:fixed;inset:0;z-index:40;background:var(--frame);display:grid;place-items:center;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.login-card{width:min(380px,100%);padding:22px;display:grid;gap:12px}
.login-card .brand{margin:0 0 4px}
.login-card h1{font-size:1.35rem}
.lg-fields{display:grid;gap:6px}
.lg-fields label{font-size:.85rem;color:var(--muted);font-weight:600}
.lg-fields input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;font-size:16px;background:#fff}
.lg-err{margin:0;color:#a3341f;font-size:.9rem}
.net-err{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:35;background:#a3341f;color:#fff;padding:10px 14px;border-radius:10px;font-size:.9rem;max-width:calc(100% - 32px)}
@media (max-width:900px){ .grid2{grid-template-columns:1fr} }
@media (max-width:480px){ .floor{padding:5px;border-radius:12px} .floor-bar{font-size:.72rem} .floor-bar .tip,.chip.work{display:none} .chip{font-size:.78rem;padding:5px 9px} .top .btn{padding:0 12px} .demo{display:none} .top-in{gap:8px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <div class="brand"><span class="logo">О</span>Офис <span class="demo">пример</span></div>
    <span class="chip work">Работают: <b id="cWork">0</b></span>
    <button class="chip" id="cAsk" type="button">Ждут вас: <b id="cAskN">0</b></button>
    <button id="btnReport" class="btn" type="button">Отчёт</button>
  </div>
</header>

<main class="wrap">
  <section class="floor" aria-label="Этаж офиса">
    <div class="floor-bar"><span>Этаж 1 · <b id="fbRooms">1 комната</b></span><span class="tip">Офис работает круглосуточно, даже когда экран закрыт</span></div>
    <svg id="scene" role="img" aria-label="Офис, вид сверху"></svg>
  </section>

  <div class="grid2">
    <div class="col">
      <section id="questions" class="questions" aria-label="Ждут вашего решения"></section>
      <section class="card pad">
        <h2>Кто чем занят</h2>
        <ul class="staff" id="staff"></ul>
      </section>
    </div>
    <div class="col">
      <section class="card pad">
        <form id="taskForm" class="task-form">
          <h2>Задание директору</h2>
          <label for="taskText">Что нужно сделать</label>
          <textarea id="taskText" rows="2" placeholder="Например: три варианта иконки" required></textarea>
          <div class="row">
            <div><label for="taskProject">Проект</label><select id="taskProject"></select></div>
            <div><label for="taskRoom">Комната</label>
              <select id="taskRoom"><option value="auto">Пусть решит директор</option><option value="design">Дизайн</option><option value="system">Система</option><option value="content">Контент</option><option value="analytics">Аналитика</option></select></div>
          </div>
          <button class="btn primary" type="submit">Отдать директору</button>
        </form>
      </section>
      <section class="card pad feed"><h2>Что происходит</h2><ol id="feed"></ol></section>
    </div>
  </div>
  <footer><button id="btnReset" class="link" type="button">Начать заново</button> · <button id="btnOut" class="link" type="button">Выйти</button></footer>
</main>
<div id="netErr" class="net-err" role="status" hidden></div>

<div id="login" class="login" hidden>
  <form id="loginForm" class="login-card card" novalidate>
    <div class="brand"><span class="logo">О</span>Офис</div>
    <h1 id="lgTitle">Вход</h1>
    <div id="lgFields" class="lg-fields">
      <label for="lgEmail">Почта</label>
      <input id="lgEmail" type="email" inputmode="email" autocomplete="username" autocapitalize="off" required>
      <label for="lgPass">Пароль</label>
      <input id="lgPass" type="password" autocomplete="current-password" minlength="6" required>
    </div>
    <div id="inviteRow" class="lg-fields" hidden>
      <label for="lgInvite">Код приглашения</label>
      <input id="lgInvite" autocomplete="off" autocapitalize="characters" placeholder="6 знаков">
    </div>
    <p id="lgErr" class="lg-err" role="alert" hidden></p>
    <button class="btn primary" type="submit" id="lgBtn">Войти</button>
    <button class="link" type="button" id="lgSwitch">Первый раз? Создать аккаунт</button>
  </form>
</div>

<div id="modal" class="modal" hidden>
  <div class="sheet card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="btn" id="btnClose" type="button">Закрыть</button></div>
    <div id="sheetBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ================= Справочники ================= */
const PROJECTS = [
  {id:'pipo',    name:'Wallet (PIPO)',          short:'PIPO',    color:'#2f6fdf'},
  {id:'eslarma', name:'Instagram (eslarma.uz)', short:'eslarma', color:'#d9467a'},
  {id:'kunlik',  name:'«Кунлик вирд»',          short:'Кунлик',  color:'#2e9e6a'}
];
/* Комнаты: в каждой один делает, второй проверяет. Работой управляет сервер (Supabase, каждые 5 секунд, круглосуточно). */
const ROOMS = {
  design:   {name:'Дизайн',    sub:'рисует · проверяет',          doer:'malika',  checker:'timur',  idle:'Собирает референсы', talk:['Кнопка заметна?','Да, только крупнее']},
  system:   {name:'Система',   sub:'пишет код · тестирует',       doer:'aziz',    checker:'nigora', idle:'Пишет тесты',        talk:['Тут может упасть?','Добавлю проверку']},
  content:  {name:'Контент',   sub:'пишет тексты · редактирует',  doer:'dilnoza', checker:'bobur',  idle:'Читает комментарии', talk:['Первая фраза цепляет?','Да, только короче']},
  analytics:{name:'Аналитика', sub:'считает · сверяет цифры',     doer:'shahzod', checker:'kamila', idle:'Собирает данные',    talk:['Цифры сходятся?','Да, сверила с отчётом']}
};
const PEOPLE = {
  director:{name:'Рустам', role:'Директор', fem:false, dat:'Рустаму',
    look:{skin:'#deb08a', hair:'#7c7c7c', style:'short', beard:true, top:'#2b3a4c', pants:'#2b3a4c', kind:'suit', accent:'#b5413a'}},
  malika:{name:'Малика', role:'Дизайнер', fem:true, dat:'Малике',
    look:{skin:'#f0c6a3', hair:'#3a2416', style:'long', top:'#d9734f', pants:'#3f5578', kind:'sweater'}},
  timur:{name:'Тимур', role:'Проверяет дизайн', fem:false, dat:'Тимуру',
    look:{skin:'#c58c62', hair:'#1e1a18', style:'short', top:'#3d7ea6', pants:'#2f3640', kind:'shirt', glasses:true}},
  aziz:{name:'Азиз', role:'Программист', fem:false, dat:'Азизу',
    look:{skin:'#d9a37c', hair:'#14110f', style:'short', top:'#3f6e4f', pants:'#2b2f36', kind:'sweater'}},
  nigora:{name:'Нигора', role:'Тестировщик', fem:true, dat:'Нигоре',
    look:{skin:'#eac0a0', hair:'#2a1a12', style:'long', top:'#8a5fb8', pants:'#3a3f4a', kind:'shirt', glasses:true}},
  dilnoza:{name:'Дилноза', role:'Автор текстов', fem:true, dat:'Дилнозе',
    look:{skin:'#f2cfb0', hair:'#4a2a18', style:'long', top:'#e0a43a', pants:'#3f5578', kind:'sweater'}},
  bobur:{name:'Бобур', role:'Редактор', fem:false, dat:'Бобуру',
    look:{skin:'#c99068', hair:'#2b211c', style:'short', beard:true, top:'#5a6b7c', pants:'#2f3640', kind:'shirt'}},
  shahzod:{name:'Шахзод', role:'Аналитик', fem:false, dat:'Шахзоду',
    look:{skin:'#e0b48e', hair:'#1b1613', style:'short', top:'#2f8f8a', pants:'#2b3a4c', kind:'shirt', glasses:true}},
  kamila:{name:'Камила', role:'Проверяет цифры', fem:true, dat:'Камиле',
    look:{skin:'#e8bb96', hair:'#1c120d', style:'long', top:'#c94f6d', pants:'#2f3640', kind:'sweater'}}
};
const proj = id => PROJECTS.find(p=>p.id===id) || PROJECTS[0];
const roomOf = id => Object.keys(ROOMS).find(r=>ROOMS[r].doer===id||ROOMS[r].checker===id);

/* ================= Планировка этажа ================= */
const LAYOUTS = {
  wide:{W:1000,H:600, gaps:[328],
    zones:{director:{x:20,y:92,w:290,h:228}, design:{x:326,y:92,w:340,h:228}, meeting:{x:682,y:92,w:298,h:228},
           content:{x:20,y:336,w:290,h:248}, system:{x:326,y:336,w:340,h:248}, analytics:{x:682,y:336,w:298,h:248}},
    wall:[['win',30,130],['win',176,130],['pic',330,34],['scr',392,150],['clock',580],['win',630,130],['win',776,130],['plant',934]]},
  tall:{W:560,H:1312, gaps:[320,566,812,1058],
    zones:{director:{x:16,y:92,w:256,h:220}, meeting:{x:288,y:92,w:256,h:220}, design:{x:16,y:328,w:528,h:230},
           system:{x:16,y:574,w:528,h:230}, content:{x:16,y:820,w:528,h:230}, analytics:{x:16,y:1066,w:528,h:230}},
    wall:[['win',18,112],['win',140,112],['scr',268,140],['clock',438],['pic',470,34],['plant',528]]}
};
let L, G; // текущая планировка и рассчитанные места

function geometry(){
  const Z=L.zones, g={desks:[], spots:{}};
  const dz=Z.director, dcx=dz.x+dz.w/2, dd0=dz.y+100;
  g.desks.push({id:'director', cx:dcx, d0:dd0, w:140});
  g.spots.director={seat:{x:dcx,y:dd0+12,zone:'director'}, stand:{x:dcx+86,y:dd0+62,zone:'director'}};
  const m=Z.meeting, mx=m.x+m.w/2, my=m.y+m.h/2+30;
  for(const [rid,R] of Object.entries(ROOMS)){
    const z=Z[rid], cx=z.x+z.w/2, d0=z.y+100, off=Math.min(82, z.w/4), dw=z.w<320?106:118;
    g.spots.director['visit_'+rid]={x:cx, y:d0+86, zone:rid};
    [R.doer,R.checker].forEach((id,i)=>{
      const x=cx+(i?off:-off), side=i?1:-1;
      g.desks.push({id, cx:x, d0, w:dw});
      g.spots[id]={
        seat:{x, y:d0+12, zone:rid},
        stand:{x:x+side*(dw/2+16), y:d0+62, zone:rid},
        meet:{x:mx+side*84, y:my+12, zone:'meeting'}
      };
    });
  }
  return g;
}

/* ================= Общая база (Supabase): одно состояние на всех устройствах ================= */

const SB_KEY='sb_publishable_B5Os-lN4DIr-boNf_4Jl6w_Ftvni6ji'; // открытый ключ: данные защищены входом владельца

let S = {tasks:[], questions:[], feed:[], talk:0, talkRoom:null, dirSayUntil:0, dirNote:'', dirVisit:null, demo:true};

function applyState(o){ if(!o) return; S.talk=o.talk; S.talkRoom=o.talk_room; S.dirSayUntil=o.dir_say_until?Date.parse(o.dir_say_until):0;
  S.dirNote=o.dir_note||''; S.dirVisit=o.dir_visit&&ROOMS[o.dir_visit]?o.dir_visit:null; S.demo=o.demo; }
function upsertLocal(arr,row){ const i=arr.findIndex(x=>x.id===row.id); if(i<0) arr.push(row); else arr[i]=Object.assign(arr[i],row); }
async function loadAll(){
  const [t,q,e,o]=await Promise.all([
    sb.from('tasks').select('*').order('id'),
    sb.from('questions').select('*').is('answer',null).order('id'),
    sb.from('events').select('*').order('created_at',{ascending:false}).limit(40),
    sb.from('office_state').select('*').eq('id',1).maybeSingle()]);
  for(const r of [t,q,e,o]) if(r.error) throw r.error;
  S.tasks=t.data; S.questions=q.data; S.feed=e.data.reverse(); applyState(o.data);
  qKey='x';
}
let channel=null;
function subscribe(){
  if(channel) sb.removeChannel(channel);
  channel=sb.channel('office-'+CID).on('postgres_changes',{event:'*',schema:'public'},p=>{
    const row=p.new, old=p.old, del=p.eventType==='DELETE';
    if(p.table==='tasks'){ if(del) S.tasks=S.tasks.filter(x=>x.id!==old.id); else { upsertLocal(S.tasks,row); S.tasks.sort((a,b)=>a.id-b.id); } }
    if(p.table==='questions'){ if(del||row.answer!=null) S.questions=S.questions.filter(x=>x.id!==(del?old.id:row.id)); else upsertLocal(S.questions,row); }
    if(p.table==='events'){ if(p.eventType==='INSERT'){ if(!S.feed.some(f=>f.id===row.id)){ S.feed.push(row); if(S.feed.length>40) S.feed.shift(); } } else if(del) S.feed=S.feed.filter(f=>f.id!==old.id); }
    if(p.table==='office_state' && row) applyState(row);
    paint();
  }).subscribe(st=>{ if(st==='SUBSCRIBED') loadAll().then(paint).catch(showErr); });
}
function showErr(e){ console.error(e); const n=$('#netErr'); if(n){ n.hidden=false; n.textContent='Нет связи с базой. Проверьте интернет — страница обновится сама.'; clearTimeout(showErr.t); showErr.t=setTimeout(()=>n.hidden=true,6000);} }
async function patchTask(t,patch){ Object.assign(t,patch); const {error}=await sb.from('tasks').update(patch).eq('id',t.id); if(error) showErr(error); }

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const cut=(s,n)=>s.length>n? s.slice(0,n-1)+'…' : s;
function shade(hex,k){const n=parseInt(hex.slice(1),16);const f=v=>Math.round(k<0?v*(1+k):v+(255-v)*k);
  return '#'+[n>>16,n>>8&255,n&255].map(v=>f(v).toString(16).padStart(2,'0')).join('');}
function log(text,me){
  sb.from('events').insert({text,by_me:!!me}).select().single().then(({data,error})=>{
    if(error) return showErr(error);
    if(!S.feed.some(f=>f.id===data.id)){ S.feed.push(data); if(S.feed.length>40) S.feed.shift(); paint(); }
  });
}

/* ================= Перемещения ================= */
const R={}; for(const id of Object.keys(PEOPLE)) R[id]={place:null,x:null,y:null,walking:false};
const SPEED=95; // единиц этажа в секунду
const tr=(x,y)=>`translate(${x}px, ${y}px)`;
function setPose(el,pose){ ['sitf','stand','walk','cup'].forEach(p=>el.classList.remove('pose-'+p)); el.classList.add('pose-'+pose); el.classList.toggle('walk', pose==='walk'); }
function toLayer(el,layer){ const L_=$('#lay-'+layer); if(el.parentNode!==L_) L_.appendChild(el); }
function pickGap(y1,y2){
  const lo=Math.min(y1,y2), hi=Math.max(y1,y2);
  const between=L.gaps.filter(g=>g>lo&&g<hi);
  const pool=between.length?between:L.gaps;
  return pool.reduce((a,b)=>Math.abs(b-y1)<Math.abs(a-y1)?b:a);
}
function goTo(id,place,instant){
  const r=R[id]; if(r.walking) return;
  if(r.place===place && !instant) return;
  const sp=G.spots[id][place], el=$('#p-'+id);
  const pose = place==='seat'?'sitf' : 'stand';
  const finish=()=>{ r.place=place; setPose(el,pose); toLayer(el, place==='seat'?'behind':'front'); paint(); };
  if(instant || r.x==null || reduceMotion){ el.style.transform=tr(sp.x,sp.y); r.x=sp.x; r.y=sp.y; finish(); return; }
  const st=G.spots[id].stand, pts=[[r.x,r.y]];
  let zone = r.place ? G.spots[id][r.place].zone : sp.zone;
  if(r.place==='seat'){ pts.push([st.x,r.y],[st.x,st.y]); }
  const via = place==='seat' ? [st.x,st.y] : [sp.x,sp.y];
  const cur=pts[pts.length-1];
  if(zone!==sp.zone){ const g=pickGap(cur[1],via[1]); pts.push([cur[0],g],[via[0],g]); }
  if(place==='seat'){ pts.push([st.x,st.y],[st.x,sp.y]); }
  pts.push([sp.x,sp.y]);
  const P=pts.filter((p,i)=>i===0||p[0]!==pts[i-1][0]||p[1]!==pts[i-1][1]);
  const d=[0]; for(let i=1;i<P.length;i++) d.push(d[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));
  const total=d[d.length-1]; if(total<1){ el.style.transform=tr(sp.x,sp.y); r.x=sp.x; r.y=sp.y; finish(); return; }
  r.walking=true; setPose(el,'walk'); el.classList.remove('asking'); setSay(el,''); toLayer(el,'front');
  const dur=total/SPEED*1000;
  const a=el.animate(P.map((p,i)=>({transform:tr(p[0],p[1]),offset:d[i]/total})),{duration:dur,easing:'linear',fill:'forwards'});
  let over=false;
  const arrive=()=>{ if(over) return; over=true; el.style.transform=tr(sp.x,sp.y); a.cancel(); r.x=sp.x; r.y=sp.y; r.walking=false; finish(); };
  a.finished.then(arrive).catch(()=>{});
  setTimeout(arrive, dur+250);
}
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function setSay(el,text,kind){
  const g=el.querySelector('.say'); if(g.dataset.v===(text||'')+(kind||'')) return;
  g.dataset.v=(text||'')+(kind||'');
  if(!text){ g.innerHTML=''; return; }
  if(kind==='ask'){ g.innerHTML=`<g class="say-q"><circle r="9" fill="#f0a020" stroke="#fff" stroke-width="1.5"/><text y="4.2" text-anchor="middle" style="font-weight:800;font-size:12px;fill:#1c252d">?</text></g>`; return; }
  const w=Math.round(text.length*4.7+14);
  g.innerHTML=`<rect x="${-w/2}" y="-11" width="${w}" height="17" rx="8" fill="#fff" stroke="#cfd6dd"/><path d="M-3 6 L0 10 L3 6 Z" fill="#fff"/><text y="1" text-anchor="middle" style="font-size:8.5px;fill:#1b2530">${esc(text)}</text>`;
}

/* ================= Логика офиса: всё решает сервер, экран только показывает ================= */
const doerTask=room=>S.tasks.find(t=>t.room===room&&t.status==='work');
const checkerTask=room=>S.tasks.find(t=>t.room===room&&t.status==='review');
const qFrom=id=>S.questions.find(q=>q.from_person===id);
const talking=rid=>S.talk>0&&S.talkRoom===rid;
async function answer(qid,text){
  text=String(text).trim(); if(!text) return;
  const q=S.questions.find(x=>x.id===qid); if(!q) return;
  S.questions=S.questions.filter(x=>x!==q);
  $('#modal').hidden=true; paint();
  const {error}=await sb.from('questions').update({answer:text,answered_at:new Date().toISOString()}).eq('id',qid);
  if(error){ S.questions.push(q); paint(); return showErr(error); }
  const t=S.tasks.find(x=>x.id===q.task_id), p=PEOPLE[q.from_person];
  log(`Вы ответили ${p.dat}: «${text}».`,true);
  if(t){ const patch={answer:text}; if(t.status==='review') patch.status='done'; await patchTask(t,patch);
    if(patch.status) log(`${p.name} ${p.fem?'закончила':'закончил'} «${t.title}» с вашим выбором — готово.`); }
  paint();
}

/* ================= Отрисовка состояния ================= */
function placeFor(id){
  if(id==='director') return S.dirVisit ? 'visit_'+S.dirVisit : 'seat';
  const rid=roomOf(id);
  if(qFrom(id)) return 'stand';
  if(talking(rid)) return 'meet';
  return 'seat'; // без задачи сотрудник не уходит пить кофе — готовится к следующей
}
function statusOf(id){
  const r=R[id];
  if(id==='director'){
    if(S.dirVisit) return r.walking?`Идёт в «${ROOMS[S.dirVisit].name}»`:`Проверяет комнату «${ROOMS[S.dirVisit].name}»`;
    if(r.walking) return 'Возвращается в кабинет';
    return S.questions.length?`Ждут вашего решения: ${S.questions.length} — через 3 мин решит сам`:'Планирует задачи и следит за всеми';
  }
  const rid=roomOf(id), Rm=ROOMS[rid];
  if(qFrom(id)) return 'Ждёт вашего ответа';
  if(r.walking) return 'Идёт';
  if(r.place==='meet') return 'Советуется в переговорке';
  if(id===Rm.checker) return checkerTask(rid)?'Проверяет':Rm.idle;
  return doerTask(rid)?'Работает':'Берёт следующую задачу';
}
function taskOf(id){
  const rid=roomOf(id); if(!rid) return null; const Rm=ROOMS[rid];
  if(id===Rm.doer) return doerTask(rid);
  return checkerTask(rid) || (qFrom(id)&&S.tasks.find(t=>t.id===qFrom(id).task_id));
}function setTag(id,pr,text){
  const g=$('#tag-'+id); if(!g) return;
  const pill=g.querySelector('.pill'), pt=g.querySelector('.pill-t'), tt=g.querySelector('.tag-t');
  const label=pr?pr.short:'—'; const w=label.length*4.6+8;
  pill.setAttribute('width',w); pill.setAttribute('fill',pr?pr.color:'#b9c2cb');
  pt.textContent=label; tt.setAttribute('x', +pill.getAttribute('x')+w+5);
  const desk=G.desks.find(d=>d.id===id); const room=Math.floor((desk.w-12-w-12)/4.9);
  tt.textContent=cut(text, Math.max(6,room));
}

let qKey='';
function paint(){
  // перемещения
  for(const id of Object.keys(PEOPLE)) goTo(id, placeFor(id));
  // позы, пузыри, таблички
  for(const id of Object.keys(PEOPLE)){
    const el=$('#p-'+id), r=R[id], q=qFrom(id), t=taskOf(id);
    if(!r.walking){
      el.classList.toggle('asking', !!q && r.place==='stand');
      el.classList.toggle('busy', r.place==='seat');
      let say='', kind='';
      if(q && r.place==='stand'){ say='?'; kind='ask'; }
      else if(r.place==='meet' && S.talk>0 && S.talkRoom){ const Rm=ROOMS[S.talkRoom]; say = id===Rm.doer ? Rm.talk[0] : Rm.talk[1]; }
      else if(id==='director' && S.dirNote && (S.dirVisit || Date.now()<S.dirSayUntil)) say=cut(S.dirNote,30);
      setSay(el,say,kind);
    }
    if(id==='director'){ setTag(id,{short:'Все',color:'#f0a020'},S.dirVisit?'Обходит комнаты':'Планирует задачи'); $('#nm-director').textContent='Рустам · директор'; }
    else { const pr=t?proj(t.project):null; setTag(id,pr,t?t.title:statusOf(id)); $('#nm-'+id).textContent=`${PEOPLE[id].name} · ${PEOPLE[id].role.toLowerCase()}`; }
  }
  // порядок по глубине
  const front=$('#lay-front');
  if(!Object.values(R).some(r=>r.walking)){
    const cur=[...front.children], want=cur.slice().sort((a,b)=>R[a.id.slice(2)].y-R[b.id.slice(2)].y);
    if(want.some((n,i)=>n!==cur[i])) want.forEach(n=>front.appendChild(n));
  }

  // стена: экран, часы, доска
  const done=S.tasks.filter(t=>t.status==='done').length, open=S.tasks.length-done;
  const sd=$('#scrDone'); if(sd){ sd.textContent=`Готово: ${done}`; $('#scrWork').textContent=`В работе: ${open}`; }
  const now=new Date(), cx=+$('#clkH')?.getAttribute('x1'), cy=38;
  if(cx){ const ha=((now.getHours()%12)+now.getMinutes()/60)*30*Math.PI/180, ma=now.getMinutes()*6*Math.PI/180;
    $('#clkH').setAttribute('x2',cx+7*Math.sin(ha)); $('#clkH').setAttribute('y2',cy-7*Math.cos(ha));
    $('#clkM').setAttribute('x2',cx+11*Math.sin(ma)); $('#clkM').setAttribute('y2',cy-11*Math.cos(ma)); }
  PROJECTS.forEach(p=>{ const el=$('#brd-'+p.id); if(el){ const n=S.tasks.filter(t=>t.project===p.id&&t.status!=='done').length; el.textContent=n?`в работе ${n}`:'—'; } });

  // верхняя панель
  const working=Object.keys(PEOPLE).filter(id=>!qFrom(id)).length;
  $('#cWork').textContent=working;
  $('#cAskN').textContent=S.questions.length; $('#cAsk').classList.toggle('hot',S.questions.length>0);

  // вопросы
  const k=S.questions.map(q=>q.id).join(',');
  if(k!==qKey){ qKey=k; $('#questions').innerHTML=S.questions.map(q=>qHTML(q,'l')).join(''); }

  // список сотрудников
  $('#staff').innerHTML=Object.keys(PEOPLE).map(id=>{
    const p=PEOPLE[id], t=taskOf(id), pr=t?proj(t.project):null, st=statusOf(id);
    return `<li data-id="${id}"><span class="ava" style="background:${p.look.top}">${esc(p.name[0])}</span>
      <div><div class="s-top"><b>${esc(p.name)}</b><span>${esc(p.role)}</span></div>
      <div class="s-task">${id==='director'?'Все проекты · 4 комнаты':pr?`<span class="dot" style="background:${pr.color}"></span> ${esc(pr.name)} · ${esc(t.title)}`:`Комната «${esc(ROOMS[roomOf(id)].name)}»`}</div>
      <div class="s-st ${qFrom(id)?'wait':''}">${esc(st)}</div>
      ${t&&id!=='director'?`<div class="bar"><i style="width:${t.progress}%"></i></div>`:''}</div></li>`;
  }).join('');

  // лента
  $('#feed').innerHTML=S.feed.slice().reverse().map(f=>{
    const d=new Date(f.created_at), hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    return `<li class="${f.by_me?'me':''}"><time>${hm}</time><span>${esc(f.text)}</span></li>`;
  }).join('');
  if(!$('#modal').hidden && sheetMode==='report') renderReport();
}

function qHTML(q,pre){
  const t=S.tasks.find(x=>x.id===q.task_id), p=PEOPLE[q.from_person], pr=proj(t?t.project:'pipo');
  return `<div class="q" id="${pre}-q-${q.id}">
    <div class="q-head"><b>${esc(p.name)}</b> ${esc(p.role.toLowerCase())} · <span class="dot" style="background:${pr.color}"></span> ${esc(pr.name)} · ${esc(t?t.title:'')}</div>
    <p class="q-text">${esc(q.text)}</p>
    <div class="q-opts">${q.options.map((o,i)=>`<button class="btn" type="button" data-q="${q.id}" data-i="${i}">${esc(o)}</button>`).join('')}</div>
    <form class="q-own" data-q="${q.id}"><input id="${pre}-own-${q.id}" aria-label="Свой ответ" placeholder="Или напишите свой ответ" autocomplete="off"><button class="btn primary" type="submit">Ответить</button></form>
  </div>`;
}

/* ================= Окна: сотрудник и отчёт ================= */
let sheetMode='';
function openPerson(id){
  const p=PEOPLE[id], t=taskOf(id), pr=t?proj(t.project):null, q=qFrom(id);
  sheetMode='person';
  $('#sheetTitle').textContent=`${p.name} · ${p.role.toLowerCase()}`;
  $('#sheetBody').innerHTML=`<dl class="facts">
      <dt>Сейчас</dt><dd>${esc(statusOf(id))}</dd>
      <dt>Проект</dt><dd>${id==='director'?'Все проекты':pr?`<span class="dot" style="background:${pr.color}"></span> ${esc(pr.name)}`:'—'}</dd>
      <dt>Задача</dt><dd>${id==='director'?'Ставит задачи всем комнатам, обходит их, принимает работу и сам решает вопросы, если вы не ответили за 3 минуты':t?esc(t.title):esc(statusOf(id))}</dd>
      ${t&&id!=='director'?`<dt>Готово</dt><dd>${t.progress}%</dd>`:''}
    </dl>${q?qHTML(q,'s'):''}`;
  $('#modal').hidden=false; $('#btnClose').focus();
}
function renderReport(){
  const done=S.tasks.filter(t=>t.status==='done'), work=S.tasks.filter(t=>t.status!=='done');
  const item=t=>{const p=proj(t.project);return `<span class="dot" style="background:${p.color}"></span>${esc(p.name)} — ${esc(t.title)}${ROOMS[t.room]?` <small class="hint">· ${esc(ROOMS[t.room].name)}</small>`:''}`};
  const stage=t=>(t.room==='auto'?'у директора':{queue:'в очереди',work:'делается',review:'на проверке'}[t.status]);
  $('#sheetBody').innerHTML=`<div class="rep">
    <p class="summary">Готово: ${done.length}. В работе: ${work.length}. Ждёт вашего решения: ${S.questions.length}.</p>
    <h3>Ждёт вашего решения</h3>
    <ul>${S.questions.map(q=>{const t=S.tasks.find(x=>x.id===q.task_id);return `<li>${t?item(t):''}: ${esc(q.text)} <button class="btn" type="button" data-goto="${q.from_person}">Ответить</button></li>`}).join('')||'<li class="none">Ничего</li>'}</ul>
    <h3>В работе</h3>
    <ul>${work.map(t=>`<li>${item(t)} <small class="hint">· ${stage(t)}</small></li>`).join('')||'<li class="none">Ничего</li>'}</ul>
    <h3>Готово</h3>
    <ul>${done.map(t=>`<li>${item(t)}${t.answer?` <small class="hint">· ваш выбор: ${esc(t.answer)}</small>`:''}</li>`).join('')||'<li class="none">Пока ничего</li>'}</ul></div>`;
}

/* ================= Запуск ================= */
const mqTall=matchMedia('(max-width: 900px)');
function setup(){
  L = mqTall.matches ? LAYOUTS.tall : LAYOUTS.wide;
  G = geometry();
  buildScene();
  for(const id of Object.keys(PEOPLE)){ R[id].walking=false; R[id].place=null; R[id].x=null; goTo(id, placeFor(id), true); }
  $('#fbRooms').textContent = Object.keys(ROOMS).length+' комнаты · '+Object.keys(PEOPLE).length+' сотрудников';
  qKey='x'; paint();
}
mqTall.addEventListener('change', setup);

$('#taskProject').innerHTML=PROJECTS.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
$('#taskForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const title=$('#taskText').value.trim(); if(!title) return;
  const btn=e.submitter; if(btn) btn.disabled=true;
  const row={title,project:$('#taskProject').value,room:$('#taskRoom').value,status:'queue',progress:0,ask_doer:true,ask_check:false,by_director:false};
  const {data,error}=await sb.from('tasks').insert(row).select().single();
  if(btn) btn.disabled=false;
  if(error) return showErr(error);
  if(!S.tasks.some(t=>t.id===data.id)) S.tasks.push(data);
  $('#taskText').value='';
  log(`Вы дали задание: «${title}» (${proj(data.project).name}).`,true);
  paint();
});
function onAnswerClick(e){ const b=e.target.closest('button[data-i]'); if(!b) return; const q=S.questions.find(x=>x.id==b.dataset.q); if(q) answer(q.id,q.options[b.dataset.i]); }
function onAnswerSubmit(e){ e.preventDefault(); const f=e.target; answer(Number(f.dataset.q), f.querySelector('input').value); }
$('#questions').addEventListener('click',onAnswerClick);
$('#questions').addEventListener('submit',onAnswerSubmit);
$('#sheetBody').addEventListener('click',e=>{ onAnswerClick(e); const g=e.target.closest('[data-goto]'); if(g) openPerson(g.dataset.goto); });
$('#sheetBody').addEventListener('submit',onAnswerSubmit);
$('#staff').addEventListener('click',e=>{ const li=e.target.closest('li[data-id]'); if(li) openPerson(li.dataset.id); });
$('#cAsk').onclick=()=>{ const f=S.questions[0]; if(f) openPerson(f.from_person); };
$('#btnReport').onclick=()=>{ sheetMode='report'; $('#sheetTitle').textContent='Отчёт директора'; renderReport(); $('#modal').hidden=false; $('#btnClose').focus(); };
$('#btnClose').onclick=()=>{ $('#modal').hidden=true; };
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') $('#modal').hidden=true; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('#modal').hidden=true; });
$('#btnReset').onclick=async()=>{ const {error}=await sb.rpc('reset_demo'); if(error) return showErr(error); await loadAll(); setup(); };
$('#btnOut').onclick=async()=>{ await sb.auth.signOut(); location.reload(); };

/* ================= Вход ================= */
let ready=false, mode='in';
const ERR={'Invalid login credentials':'Неверная почта или пароль.','User already registered':'Такой аккаунт уже есть. Нажмите «Уже есть аккаунт? Войти».',
  'Email not confirmed':'Почта не подтверждена. Откройте письмо от Supabase.'};
function lgMsg(t){ const e=$('#lgErr'); e.hidden=!t; e.textContent=t||''; }
function setMode(m){
  mode=m;
  $('#lgTitle').textContent = m==='up'?'Создать аккаунт': m==='claim'?'Код приглашения':'Вход';
  $('#lgFields').hidden = m==='claim';
  $('#inviteRow').hidden = m==='in';
  $('#lgBtn').textContent = m==='up'?'Создать и войти': m==='claim'?'Подтвердить':'Войти';
  $('#lgSwitch').hidden = m==='claim';
  $('#lgSwitch').textContent = m==='up'?'Уже есть аккаунт? Войти':'Первый раз? Создать аккаунт';
  $('#lgPass').autocomplete = m==='up'?'new-password':'current-password';
  $('#lgEmail').required=$('#lgPass').required = m!=='claim';
  lgMsg('');
}
function showLogin(m){ $('#login').hidden=false; setMode(m||'in'); }
$('#lgSwitch').onclick=()=>setMode(mode==='up'?'in':'up');
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault(); lgMsg(''); const btn=$('#lgBtn'); btn.disabled=true;
  try{
    const email=$('#lgEmail').value.trim(), password=$('#lgPass').value, invite=$('#lgInvite').value;
    if(mode==='up'){
      const {data,error}=await sb.auth.signUp({email,password});
      if(error) return lgMsg(ERR[error.message]||('Не получилось: '+error.message));
      if(!data.session) return lgMsg('Мы отправили письмо на вашу почту. Откройте его, подтвердите и войдите.');
    } else if(mode==='in'){
      const {error}=await sb.auth.signInWithPassword({email,password});
      if(error) return lgMsg(ERR[error.message]||('Не получилось: '+error.message));
    }
    if(mode!=='in'){
      const {data:ok,error}=await sb.rpc('claim_owner',{invite});
      if(error) return lgMsg('Не получилось: '+error.message);
      if(!ok) return lgMsg('Код не подошёл. Проверьте его или спросите у Claude.');
    }
    await startApp();
  } finally { btn.disabled=false; }
});

async function startApp(){
  const {data:own,error}=await sb.rpc('is_owner');
  if(error){ showLogin('in'); return lgMsg('Нет связи с базой. Проверьте интернет.'); }
  if(!own){ showLogin('claim'); return lgMsg('Этот вход ещё не привязан к офису. Введите код приглашения.'); }
  $('#login').hidden=true;
  try{ await loadAll(); }catch(e){ showErr(e); }
  ready=true; setup(); subscribe();
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && ready) loadAll().then(paint).catch(showErr); });

setup();
setInterval(()=>{ if(ready) paint(); },1000);
if(!sb){ showLogin('in'); lgMsg('Не загрузилась связь с базой. Проверьте интернет и обновите страницу.'); }
else sb.auth.getSession().then(({data})=>{ if(data.session) startApp(); else showLogin('in'); });

if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
